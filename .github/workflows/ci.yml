name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Web Dependencies
        working-directory: web
        run: npm ci

      - name: Build Web Studio
        working-directory: web
        run: npm run build

      - name: Sync Web Dist to Embedded Assets
        run: |
          mkdir -p internal/server/web_dist
          cp -r web/dist/* internal/server/web_dist/

      - name: Run Go Tests
        run: go test -v -race ./...

      - name: Compile Application Binary
        run: go build -ldflags "-s -w" -o mailpulse cmd/mailpulse/main.go

      - name: Test Binary Execution
        run: ./mailpulse -version

  cross-compile:
    name: Cross-Platform Build Matrix
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
          - os: windows
            arch: amd64
            ext: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Studio
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Sync Web Dist to Embedded Assets
        run: |
          mkdir -p internal/server/web_dist
          cp -r web/dist/* internal/server/web_dist/

      - name: Build Target Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w" -o mailpulse-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} cmd/mailpulse/main.go

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mailpulse-${{ matrix.os }}-${{ matrix.arch }}
          path: mailpulse-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
